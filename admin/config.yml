backend:
  name: git-gateway
  branch: main

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

# Shown at the top of the CMS
site_url: https://roypiyush.com
display_url: https://roypiyush.com
logo_url: /images/favicon-32.png

collections:
  - name: "site"
    label: "Site Content"
    description: "Everything on the homepage that isn't a blog post. Split into separate files below — Project Cards, Testimonials, and About each publish independently, so editing one never gets blocked by a missing field in another."
    files:
      - name: "projects"
        label: "Work · Project Cards"
        description: "The 6 cards in the dark 'Selected work' grid. There are exactly 6 spots on the live layout — adding a 7th or removing one will change the grid's shape, so keep it at 6 unless you're comfortable with that. This file is independent from Testimonials and About — publishing here never touches them."
        file: "content/projects.json"
        fields:
          - label: "Project cards"
            name: "projects"
            widget: "list"
            summary: "{{fields.company}} — {{fields.title}}"
            collapsed: true
            fields:
              - label: "Cover image"
                name: "image"
                widget: "image"
                required: false
                hint: "Shows in the dark, monochrome-by-default work grid. Landscape photos work best."
              - label: "Image description (for screen readers)"
                name: "alt"
                widget: "string"
                required: false
                hint: "Describe what's in the photo in one short sentence, e.g. 'Fund detail screen on a mobile phone'. Leave blank only if the image is purely decorative."
              - label: "Company / client name"
                name: "company"
                widget: "string"
                required: false
                hint: "Shown in small caps at the top-left of the card, e.g. 'Perccent'."
              - label: "Context tag"
                name: "meta"
                widget: "string"
                required: false
                hint: "Shown top-right of the card — usually a year range (e.g. '2025–26') or a short tag like 'Mobile' or 'Ongoing'."
              - label: "Project title"
                name: "title"
                widget: "string"
                required: false
                hint: "The large headline on the card, e.g. 'Wealth platform and investment journeys'."
              - label: "Case study (shown when someone clicks the card)"
                name: "caseStudy"
                widget: "object"
                required: false
                collapsed: true
                hint: "Fills the panel that slides in when this card is clicked. Every field here is optional — leave any of them blank and that section just won't show. Write real project outcomes here before publishing; don't leave the placeholder text live."
                fields:
                  - label: "Tag"
                    name: "tag"
                    widget: "string"
                    required: false
                    hint: "Short label shown at the top, e.g. 'Fintech Onboarding'. Defaults to the company name if left blank."
                  - label: "Headline"
                    name: "headline"
                    widget: "string"
                    required: false
                    hint: "Bigger, more specific headline for the panel. Defaults to the card's project title if left blank."
                  - label: "Subhead"
                    name: "subhead"
                    widget: "text"
                    required: false
                    hint: "One or two sentences framing the story, shown just under the headline."
                  - label: "Problem"
                    name: "problem"
                    widget: "text"
                    required: false
                  - label: "Challenge"
                    name: "challenge"
                    widget: "text"
                    required: false
                  - label: "Solution"
                    name: "solution"
                    widget: "text"
                    required: false
                  - label: "Results"
                    name: "results"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.value}} — {{fields.label}}"
                    hint: "Up to 3 stat callouts, e.g. value '≈2×' with label 'Step completion'. Add none, one, two, or three. If you add one, both Value and Label are optional individually — but delete the entry entirely (rather than leaving both blank) if you decide not to use it."
                    fields:
                      - label: "Value"
                        name: "value"
                        widget: "string"
                        required: false
                        hint: "The big number, e.g. '≈2×', '↓ 40%', '18 days'."
                      - label: "Label"
                        name: "label"
                        widget: "string"
                        required: false
                        hint: "What the number means, e.g. 'Step completion'."
                  - label: "First button — show it?"
                    name: "cta1Show"
                    widget: "boolean"
                    required: false
                    default: true
                    hint: "The dark, filled button. Turn off to hide it entirely for this case study."
                  - label: "First button — label"
                    name: "cta1Label"
                    widget: "string"
                    required: false
                    hint: "Defaults to 'Get notes like this →' if left blank."
                  - label: "First button — link"
                    name: "cta1Link"
                    widget: "string"
                    required: false
                    hint: "Where it goes. Defaults to the Subscribe section (#subscribe) if left blank. Use a full https:// link, a mailto:, or #subscribe."
                  - label: "Second button — show it?"
                    name: "cta2Show"
                    widget: "boolean"
                    required: false
                    default: true
                    hint: "The outlined button. Turn off to hide it entirely for this case study."
                  - label: "Second button — label"
                    name: "cta2Label"
                    widget: "string"
                    required: false
                    hint: "Defaults to 'Book a discovery call' if left blank."
                  - label: "Second button — link"
                    name: "cta2Link"
                    widget: "string"
                    required: false
                    hint: "Where it goes. Defaults to Piyush's email if left blank."

      - name: "testimonials"
        label: "Testimonials"
        description: "The testimonial carousel. This file is independent from Work · Project Cards and About — publishing here never touches them."
        file: "content/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            collapsed: true
            hint: "Add, remove, or reorder as many as you like — the section adjusts automatically."
            fields:
              - label: "Quote"
                name: "quote"
                widget: "text"
                required: false
                hint: "The testimonial itself, in their words."
              - label: "Name"
                name: "name"
                widget: "string"
                required: false
              - label: "Role"
                name: "role"
                widget: "string"
                required: false
                hint: "e.g. 'Head of Product'."
              - label: "Company"
                name: "company"
                widget: "string"
                required: false
                hint: "e.g. 'Perccent'. Leave blank if not applicable."
              - label: "Brand logo"
                name: "logo"
                widget: "image"
                required: false
                hint: "Optional. A small company/brand mark shown next to the company name. Works best as a simple square icon, not a wide wordmark."
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Optional. Shows as a small circular photo next to their name. Leave blank to show a plain dot instead."

      - name: "about"
        label: "About Section"
        description: "This file is independent from Work · Project Cards and Testimonials — publishing here never touches them."
        file: "content/about.json"
        fields:
          - label: "Photo"
            name: "photo"
            widget: "image"
            required: false
            hint: "Portrait photo shown beside the about text. A 4:5 (portrait) crop works best."
          - label: "Name"
            name: "name"
            widget: "string"
            required: false
            hint: "Used everywhere the name appears — the top-left nav, the mobile menu, the big hero headline, and the footer — so it only needs to be set once."
          - label: "Location"
            name: "location"
            widget: "string"
            required: false
            hint: "Shown as a small caption under the photo, e.g. 'New Delhi'."
          - label: "Opening line"
            name: "lede"
            widget: "text"
            required: false
            hint: "The first, larger paragraph of the about section."
          - label: "Paragraph 2"
            name: "support1"
            widget: "text"
            required: false
          - label: "Paragraph 3"
            name: "support2"
            widget: "text"
            required: false
          - label: "Pull quote"
            name: "quote"
            widget: "string"
            required: false
            hint: "A short italic line shown after the bio paragraphs. Don't include quotation marks — those are added automatically."
          - label: "Currently exploring"
            name: "currentlyExploring"
            widget: "text"
            required: false
            hint: "One sentence on what Piyush is reading/thinking about right now."
          - label: "Elsewhere"
            name: "elsewhere"
            widget: "string"
            required: false
            hint: "Plain text only (not a clickable link) — shown as a small label, e.g. 'LinkedIn'."

      - name: "page"
        label: "Homepage Sections"
        description: "Headlines and paragraph copy for each section of the homepage, in the order they appear top to bottom. This is separate from Work/Proof/About above since those are lists of items, while this is fixed section text."
        file: "content/page.json"
        fields:
          - label: "Hero (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
                hint: "The small label above the name, e.g. 'Product-led Growth · Funnel Conversion Optimization'."
              - label: "Role line"
                name: "role"
                widget: "string"
                required: false
                hint: "The sentence right under the name."
              - label: "Rotating words"
                name: "changingWords"
                widget: "list"
                field: {label: "Word or phrase", name: "word", widget: "string"}
                hint: "These cycle automatically in the 'A body of work shaped by ___' line, a few seconds apart. Add, remove, or reorder as many as you like — at least one is required."
              - label: "Support line"
                name: "support"
                widget: "text"
                required: false
                hint: "The paragraph below the divider line."
              - label: "Location tag"
                name: "location"
                widget: "string"
                required: false
                hint: "First of the three small tags near the bottom of the hero, e.g. 'New Delhi, India'."
              - label: "Role tag 1"
                name: "role1"
                widget: "string"
                required: false
              - label: "Role tag 2"
                name: "role2"
                widget: "string"
                required: false

          - label: "Section 01 — The Belief"
            name: "belief"
            widget: "object"
            fields:
              - label: "Label"
                name: "label"
                widget: "string"
                required: false
                hint: "Small label next to the '01' marker, e.g. 'The belief'."
              - label: "Main statement"
                name: "lede"
                widget: "text"
                required: false
                hint: "The large opening statement of this section."
              - label: "Supporting paragraph"
                name: "support"
                widget: "text"
                required: false
              - label: "Pull-quote"
                name: "pullquote"
                widget: "string"
                required: false
                hint: "The short highlighted line in the box below the paragraph."

          - label: "Section 02 — Selected Work"
            name: "work"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Headline"
                name: "headline"
                widget: "string"
                required: false
              - label: "Hover hint"
                name: "note"
                widget: "string"
                required: false
                hint: "Small caption below the work grid, e.g. 'Hover a card to reveal...'."

          - label: "Section 03 — Blog"
            name: "writing"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Headline"
                name: "headline"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false

          - label: "Subscribe panel"
            name: "subscribe"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Headline"
                name: "headline"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Fine print"
                name: "note"
                widget: "string"
                required: false
                hint: "Small line under the email form, e.g. 'No clutter. Unsubscribe whenever you like.'."

          - label: "Section 04 — Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Headline"
                name: "headline"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false

          - label: "Section 06 — Collaboration"
            name: "collab"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                required: false
              - label: "Headline — part 1"
                name: "headlinePre"
                widget: "string"
                required: false
                hint: "First part of the sentence, before the highlighted phrase, e.g. 'I occasionally take on work where'."
              - label: "Headline — highlighted phrase"
                name: "headlineHighlight"
                widget: "string"
                required: false
                hint: "The middle phrase shown in the accent colour, e.g. 'financial product clarity'."
              - label: "Headline — part 2"
                name: "headlinePost"
                widget: "string"
                required: false
                hint: "The rest of the sentence, after the highlighted phrase, e.g. 'and growth strategy meet.'."
              - label: "Supporting paragraph"
                name: "support"
                widget: "text"
                required: false
              - label: "Side note"
                name: "sideText"
                widget: "text"
                required: false
                hint: "The line next to the arrow, e.g. 'Interested in working together? Let's build something meaningful.' (shown as plain text, without italics)."
              - label: "'Write to Piyush' button — email address"
                name: "email"
                widget: "string"
                required: false
                hint: "Just the email address, e.g. name@example.com — no 'mailto:' needed. Leave blank to keep the site's current default (piyush@funnelprolabs.com)."

  - name: "posts"
    label: "Blog Posts"
    description: "New posts always appear first on the site automatically, sorted by the Publish date field below — you don't need to reorder anything here."
    files:
      - name: "posts"
        label: "All Posts"
        file: "content/posts.json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            collapsed: true
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                required: false
                hint: "The headline shown everywhere this post appears — cards, the blog archive, and the post page itself."

              - label: "Excerpt"
                name: "excerpt"
                widget: "text"
                required: false
                hint: "One sentence shown under the title on cards and in the archive list. Keep it to a single line if possible."

              - label: "Category"
                name: "category"
                widget: "select"
                required: false
                default: "Growth without noise"
                options: ["Growth without noise", "Product & platform strategy"]
                hint: "Which of the two writing 'pillars' this post belongs to."

              - label: "Publish date"
                name: "date"
                widget: "datetime"
                required: false
                format: "YYYY-MM-DD"
                date_format: "MMMM D, YYYY"
                time_format: false
                picker_utc: true
                hint: "Controls sort order (newest first, automatically) and the date shown on the post. It does not need to match the day you're actually publishing — set it to whatever date should show."

              - label: "Read time"
                name: "readTime"
                widget: "string"
                required: false
                default: "5 min"
                hint: "A rough estimate, e.g. '5 min'. There's no need to be precise."

              - label: "Accent color"
                name: "accent"
                widget: "select"
                required: false
                default: "indigo"
                options: ["indigo", "peach", "sage", "violet", "bronze"]
                hint: "Sets the highlight color for this post's category label, pull-quote bar, and hover tint. Rotate through the options so consecutive posts don't share a color."

              - label: "Featured image"
                name: "image"
                widget: "image"
                required: false
                choose_url: true
                hint: "Shown as the card thumbnail and the large hero image on the post page. You can upload a file or paste an image URL."

              - label: "Pull-quote"
                name: "pullquote"
                widget: "string"
                required: false
                hint: "Optional. A single sentence from the post, highlighted in larger type partway through the article. Leave blank to skip."

              - label: "Body"
                name: "body"
                widget: "text"
                required: false
                hint: "The full post. Leave a blank line between paragraphs. Basic Markdown (e.g. **bold**, *italic*, [links](https://example.com)) is supported."

              - label: "URL slug"
                name: "slug"
                widget: "string"
                required: false
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase letters, numbers, and hyphens only — no spaces (e.g. my-post-title)."]
                hint: "Forms the post's web address. Set this once, when first creating the post, and avoid changing it afterwards — editing the slug on a published post breaks any links people have already saved or shared."
